name: Collect and publish

on:
  schedule:
    - cron: "17 11 * * *"   # ~7 AM Eastern
    - cron: "17 23 * * *"   # ~7 PM Eastern
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe all train numbers 1-199 for new CVS trains"
        type: boolean
        default: false
  push:
    paths: ["site/**", "collector/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Fetch the last 4 days of runs
        run: |
          # Probe for new train numbers on manual request and every Monday morning run.
          PROBE=""
          if [ "${{ inputs.probe }}" = "true" ] || { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt 12 ]; }; then PROBE="--probe"; fi
          python -m collector update --days 4 $PROBE
      - name: Refresh Amtrak's published timetable (GTFS)
        # A failed download keeps yesterday's timetable rather than blocking data collection.
        continue-on-error: true
        run: python -m collector schedule
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  pages:
    # Needs Settings -> Pages -> Source set to "GitHub Actions".
    needs: collect
    if: always() && needs.collect.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m collector site --out _site
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
