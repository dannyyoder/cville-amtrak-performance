name: Retune trip planner

on:
  schedule:
    - cron: "41 9 1 * *"    # monthly, ~5:41 AM Eastern on the 1st
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Search for better model weights (adopted only if they win on recent trips)
        run: python -m collector tune
      - name: Rescore with the chosen settings
        run: python -m collector validate
      - name: Commit model settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/model.json data/validation.json
          git diff --cached --quiet && exit 0
          git commit -m "model: monthly retune $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
