name: Backfill history

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First origin date (YYYY-MM-DD). Data begins around mid-2017."
        required: true
        default: "2023-01-01"
      end:
        description: "Last origin date (YYYY-MM-DD)"
        required: true
        default: "2024-12-31"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Backfill (stops itself after ~5 hours; rerun with the logged resume date)
        run: python -m collector backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}" --max-minutes 300
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill ${{ inputs.start }}..${{ inputs.end }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
